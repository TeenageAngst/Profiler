<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css" />
  <title>Gem — Amber desk</title>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div>
        <div class="issue">Gem v1 · Amber terminal desk</div>
        <h1>Amber desk<span class="cursor" aria-hidden="true"></span></h1>
        <p class="standfirst">Case intake &rarr; model analysis &rarr; case file. Paste text, attach files, pick a model, run.</p>
      </div>
    </header>

    <div class="console" id="console">
      <div class="console-top">
        <span><span class="dot"></span>Amber desk &middot; idle<span class="cursor" aria-hidden="true"></span></span>
        <span id="connStatus">Checking API…</span>
      </div>
      <div class="console-grid">
        <div class="pane">
          <label for="subjectName">Subject / case name</label>
          <input type="text" id="subjectName" value="CASE-001" autocomplete="off" />

          <label for="sampleText">Sample text — paste writing</label>
          <textarea id="sampleText" placeholder="Paste writing to analyze here. More text = tighter profile."></textarea>

          <label for="files">Attach files (.txt, .md, .json — multiple)</label>
          <input type="file" id="files" multiple accept=".txt,.md,.json,.text" />

          <div class="sample-row">
            <button type="button" id="loadDemo">[ LOAD DEMO ]</button>
            <button type="button" id="clearBtn">[ CLEAR ]</button>
          </div>

          <label for="modelSelect">Model</label>
          <select id="modelSelect"></select>

          <div class="ops-row">
            <button type="button" class="primary" id="runBtn">[ RUN ]</button>
            <button type="button" id="runAllBtn">[ RUN ALL ]</button>
            <button type="button" id="copyBtn">[ COPY CASE FILE ]</button>
            <button type="button" id="downloadBtn">[ DOWNLOAD CASE FILE ]</button>
          </div>
          <div class="ops-status" id="opsStatus">Desk ready. Load models to begin.</div>
        </div>

        <div class="pane">
          <span class="pane-label">Analysis</span>
          <div class="tabs">
            <button type="button" class="tab active" data-kind="iq">IQ</button>
            <button type="button" class="tab" data-kind="psychometrics">Psychometrics</button>
            <button type="button" class="tab" data-kind="themes">Themes</button>
            <button type="button" class="tab" data-kind="personalInfo">Personal info</button>
            <button type="button" class="tab" data-kind="runAll">Run all</button>
          </div>
          <div id="results" class="results-pane"><div class="empty">Select a model and run an analysis.</div></div>
        </div>
      </div>
      <div class="oplog" id="oplog"><div><b>LOG</b> &middot; Desk initialized. Awaiting input.</div></div>
    </div>
  </div>
  <script src="app.js" type="module"></script>
</body>
</html>
